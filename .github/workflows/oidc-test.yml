name: oidc-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write   # lets the job request an ID token from GitHub
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Assume role with OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          # Pull requests get the read-only role, pushes to main get the apply role
          role-to-assume: ${{ github.event_name == 'pull_request' && secrets.AWS_PLAN_ROLE_ARN || secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true

      - name: Which role am I?
        run: aws sts get-caller-identity --query Arn --output text | cut -d/ -f2
